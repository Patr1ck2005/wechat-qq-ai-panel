name: Validate panel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - name: Check public source selection
        shell: pwsh
        run: ./scripts/prepare-release.ps1 -CheckOnly
      - name: Syntax and source boundaries
        shell: pwsh
        run: |
          python -m compileall -q wq_panel panel_models
          if (git ls-files | Select-String '(^|/)(\.venv|\.local|evidence|__pycache__)/') { throw 'Private artifact tracked' }
